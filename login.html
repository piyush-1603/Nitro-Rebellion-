    <!DOCTYPE html>
    <html lang="en">

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Nitro Rebellion — Login</title>

        <section class="login-hero">
            <div class="login-card">
                <h1 class="login-title">Sign In</h1>
                <p class="login-sub">Enter your credentials to join the rebellion.</p>

                <form id="loginForm" class="login-form" novalidate>
                    <label class="input-group">
                        <span class="label-text">Email</span>
                        <input type="text" name="user" id="user" placeholder="you@domain.com" required>
                    </label>

                    <label class="input-group">
                        <span class="label-text">Password</span>
                        <div class="pw-wrap">
                            <input type="password" name="password" id="password" placeholder="••••••••" required>
                        </div>
                        <small class="error" id="passError" aria-live="polite"></small>
                    </label>

                    <!-- remember + forgot -->
                    <div class="form-row">
                        <label class="check">
                            <input type="checkbox" id="remember" name="remember">
                            <span>Remember me</span>
                        </label>
                    </div>

                    <button class="btn-primary" id="loginBtn" type="submit">Sign In</button>

                </form>
                <p class="signup-line">No account? <a href="contact.html">Contact us</a> to join the beta.</p>
            </div>
        </section>
        <footer class="footer" id="login">
            <div class="footer-container">
                <div class="footer-left">
                    <h3>NITRO REBELLION</h3>
                    <p>Rule the Streets. Break the System.</p>
                </div>
                <div class="footer-social">
                    <p class="follow-us">Follow Us</p>
                    <a href="#"><img src="https://img.icons8.com/?size=100&id=z657ovoGgS2o&format=png&color=000000"
                            alt="fb"></a>
                    <a href="#"><img src="https://img.icons8.com/?size=100&id=BrU2BBoRXiWq&format=png&color=000000"
                            alt="ig"></a>
                    <a href="#"><img src="https://img.icons8.com/?size=100&id=4eZI5999yCWV&format=png&color=000000"
                            alt="twitter"></a>
                    <a href="#"><img src="https://img.icons8.com/?size=100&id=omVNNE6wkyP7&format=png&color=000000"
                            alt="yt"></a>
                </div>
            </div>
            <div class="footer-bottom">
                © 2025 Nitro Rebellion. All Rights Reserved.
            </div>
        </footer>
